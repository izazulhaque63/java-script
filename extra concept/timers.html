<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>settime and time interval all concepts</title>
</head>
<body>
    <script>
        /*
        Bilkul. setTimeout() aur setInterval() JavaScript ke Timer Functions hain. Inka use hum code ko turant execute na karke kuch time baad, ya baar-baar fixed time gap ke baad chalane ke liye karte hain.

Main ekdum basic se samjhata hoon.

1. Sabse pehle Timer kya hota hai?

Normally JavaScript code line-by-line execute hota hai:

console.log("A");
console.log("B");
console.log("C");

Output:

A
B
C

Lekin maan lo hum chahte hain:

"Hello" abhi nahi, 3 second baad print ho.

Tab hum setTimeout() use karenge.

Aur agar hum chahte hain:

"Hello" har 3 second me baar-baar print hota rahe.

Tab hum setInterval() use karenge.

2. setTimeout() kya hota hai?
Simple definition

setTimeout() kisi function/code ko ek certain delay ke baad sirf ek baar chalata hai.

Syntax
setTimeout(function, time);

Yahan:

function → kya kaam karna hai
time     → kitne milliseconds baad karna hai

JavaScript timer me time milliseconds (ms) me diya jata hai.

1000 ms = 1 second
2000 ms = 2 seconds
3000 ms = 3 seconds
5000 ms = 5 seconds
3. setTimeout() ka basic example
setTimeout(function() {
    console.log("Hello");
}, 3000);

Iska meaning:

setTimeout(
    ye function chalao,
    3000 milliseconds baad
);

3000 ms = 3 seconds.

To output approximately 3 seconds baad:

Hello

Important:

Ye sirf ek baar chalega.

4. Is code ko line-by-line samjho
setTimeout(function() {
    console.log("Hello");
}, 3000);
Line 1
setTimeout(

JavaScript ko bol rahe hain:

Ek timer start karo.

Line 2
function() {

Ye function hai jo baad me execute hoga.

Line 3
console.log("Hello");

Timer complete hone par "Hello" print hoga.

Last
}, 3000);

3000 ka matlab:

3000 milliseconds
= 3 seconds
5. Arrow function ke saath setTimeout()

Modern JavaScript me generally arrow function use hota hai:

setTimeout(() => {
    console.log("Hello");
}, 3000);

Ye bhi same kaam karega.

6. Ek bahut important example

Guess karo output kya hoga:

console.log("Start");

setTimeout(() => {
    console.log("Hello");
}, 2000);

console.log("End");

Kya output ye hoga?

Start
Hello
End

❌ Nahi.

Output hoga:

Start
End
Hello

Hello approximately 2 seconds baad aayega.

Kyu?

JavaScript setTimeout() ke saamne rukti nahi hai.

Wo basically kehti hai:

"Okay, is function ko 2 seconds baad chalana hai. Tab tak main neeche ka code execute karti hoon."

Isliye:

Start
↓
timer set
↓
End
↓
2 sec ke baad Hello

Ye concept aage chal kar Asynchronous JavaScript samajhne me bahut important hoga.

7. Named function ke saath setTimeout()

Hum function pehle bhi bana sakte hain:

function greet() {
    console.log("Hello");
}

setTimeout(greet, 3000);

3 seconds baad:

Hello

Dhyan do:

setTimeout(greet, 3000);

✅ Correct

Lekin:

setTimeout(greet(), 3000);

❌ Usually galat hai.

Kyunki:

greet()

function ko abhi call kar raha hai.

Jabki:

greet

function ko timer ko reference ke form me de raha hai.

Ye difference yaad rakhna.

8. setInterval() kya hota hai?

Ab doosra function.

Definition

setInterval() kisi function ko fixed time gap ke baad baar-baar execute karta rehta hai.

Syntax:

setInterval(function, time);

Example:

setInterval(() => {
    console.log("Hello");
}, 2000);

Meaning:

Har approximately 2 seconds me "Hello" print karo.

Output:

Hello
Hello
Hello
Hello
Hello
...

Ye automatically stop nahi hoga.

9. setTimeout vs setInterval

Ye difference sabse important hai:

setTimeout()	setInterval()
Ek baar execute	Baar-baar execute
Delay ke baad	Har fixed interval ke baad
Automatically finish	Khud se continuously chalta rahega
Stop: clearTimeout()	Stop: clearInterval()

Easy trick:

setTimeout
    ↓
TIME OUT hone ke baad
ONE TIME

setInterval
    ↓
har INTERVAL ke baad
REPEAT
10. Practical example

Maan lo website par 5 seconds baad message dikhana hai:

setTimeout(() => {
    console.log("Welcome to our website!");
}, 5000);

Ye sirf ek baar chalega.

Lekin clock banana ho:

setInterval(() => {
    console.log(new Date());
}, 1000);

Har 1 second me current date/time print hogi.

Isliye clock jaise kaam me setInterval() useful hai.

11. clearTimeout() kya hota hai?

Kabhi-kabhi timer laga diya lekin baad me usse cancel karna ho.

Tab:

clearTimeout()

use karte hain.

Example:

let timer = setTimeout(() => {
    console.log("Hello");
}, 5000);

clearTimeout(timer);

Yahan "Hello" print nahi hoga.

Kyun?

Pehle:

let timer = setTimeout(...)

timer ki ID timer variable me aa gayi.

Phir:

clearTimeout(timer);

timer cancel kar diya.

12. Timer ID kya hoti hai?

Jab hum:

let timer = setTimeout(() => {
    console.log("Hello");
}, 3000);

likhte hain, setTimeout() ek timer identifier return karta hai.

Simple language me:

JavaScript har timer ko ek identity/number deti hai taaki baad me hum us timer ko identify karke cancel kar saken.

Isliye:

clearTimeout(timer);

ko pata hai kaunsa timer cancel karna hai.

13. clearInterval() kya hota hai?

setInterval() continuously chalta rahta hai.

Usko stop karne ke liye:

clearInterval()

use hota hai.

Example:

let timer = setInterval(() => {
    console.log("Hello");
}, 1000);

Ye print karega:

Hello
Hello
Hello
Hello
...

Stop:

clearInterval(timer);
14. Ek useful counter example
let count = 1;

let timer = setInterval(() => {
    console.log(count);
    count++;
}, 1000);

Output:

1
2
3
4
5
6
...

Har 1 second me number increase ho raha hai.

15. Counter ko 5 par stop kaise kare?
let count = 1;

let timer = setInterval(() => {

    console.log(count);

    count++;

    if (count > 5) {
        clearInterval(timer);
    }

}, 1000);

Output:

1
2
3
4
5

Uske baad interval stop.

Flow samjho

Initially:

count = 1

1 second baad:

print 1
count = 2

Next second:

print 2
count = 3

Aise chalte-chalte:

print 5
count = 6

Ab:

if (count > 5)

true ho gaya.

Isliye:

clearInterval(timer);

interval stop.

16. Function me parameter bhi bhej sakte hain

Example:

function greet(name) {
    console.log("Hello " + name);
}

setTimeout(greet, 2000, "Ali");

2 seconds baad:

Hello Ali

Yahan:

greet

function hai.

2000

delay hai.

"Ali"

function ka argument hai.

Ek beginner-friendly aur common way ye hai:

setTimeout(() => {
    greet("Ali");
}, 2000);

Ye padhna comparatively easy hai.

17. setTimeout(..., 0) ka matlab kya hai?

Ye thoda interesting hai:

console.log("A");

setTimeout(() => {
    console.log("B");
}, 0);

console.log("C");

Aapko lag sakta hai output:

A
B
C

Lekin output generally hoga:

A
C
B
Lekin 0 milliseconds tha!

Haan.

0 ka meaning ye nahi hai:

Isi exact moment par execute karo.

Iska meaning roughly hai:

Minimum delay ke baad function ko execution ke liye schedule karo.

Current synchronous code pehle finish hota hai:

console.log("A");
console.log("C");

Uske baad scheduled callback:

console.log("B");

execute ho sakta hai.

Ye aage Event Loop ke concept me detail me samajh aayega.

18. Important: exact timing guaranteed nahi hoti

Agar hum likhte hain:

setTimeout(() => {
    console.log("Hello");
}, 2000);

Iska exact meaning ye nahi hai:

Exactly 2.000000 seconds par function chalega.

Better meaning hai:

Function ko kam se kam roughly 2 seconds baad execute karne ke liye eligible/schedule karo.

Agar JavaScript kisi aur kaam me busy hai, callback thoda late ho sakta hai.

Beginner level par abhi itna yaad rakho:

setTimeout ka time = minimum/scheduled delay
exact guarantee nahi
19. Real-life analogy

Socho aap restaurant me ho.

Aap waiter ko bolte ho:

"2 minute baad mujhe water de dena."

Ye setTimeout() jaisa hai.

setTimeout(() => {
    giveWater();
}, 2000);

Water ek baar milega.

Ab aap waiter ko bolo:

"Har 2 minute me mujhe water dete rehna."

Ye setInterval() hai.

setInterval(() => {
    giveWater();
}, 2000);

Wo baar-baar karta rahega.

Aur jab aap bolo:

"Bas ab band karo."

Wo:

clearInterval()

jaisa hai.

20. Website me practical use
setTimeout() kahan use hota hai?

Jaise:

✅ 5 sec baad popup show karna
✅ notification kuch time baad hatana
✅ loading message delay karna
✅ function delayed execute karna
✅ redirect delay

Example:

setTimeout(() => {
    alert("Welcome!");
}, 3000);

3 seconds baad alert.

setInterval() kahan use hota hai?

Jaise:

✅ digital clock
✅ countdown/count-up
✅ repeated data update
✅ slideshow
✅ periodic refresh
✅ timer
21. DOM ke saath example

HTML:

<h1 id="message">Please wait...</h1>

JavaScript:

setTimeout(() => {

    document.querySelector("#message").innerText = "Welcome!";

}, 3000);

Initially:

Please wait...

3 seconds baad:

Welcome!

Yahan setTimeout() ne DOM element ka text baad me change kiya.

22. setInterval() + DOM example

HTML:

<h1 id="count">0</h1>

JavaScript:

let count = 0;

setInterval(() => {

    count++;

    document.querySelector("#count").innerText = count;

}, 1000);

Screen par:

0

phir:

1
2
3
4
5
...

Har second number badhega.

23. Common mistake 1

❌ Wrong:

setTimeout(console.log("Hello"), 2000);

Isme:

console.log("Hello")

immediately execute ho jayega.

✅ Better:

setTimeout(() => {
    console.log("Hello");
}, 2000);
24. Common mistake 2 — seconds samajh lena

Wrong expectation:

setTimeout(() => {
    console.log("Hello");
}, 5);

Aap soch rahe:

5 seconds

Lekin JavaScript samjhegi:

5 milliseconds

5 seconds ke liye:

5000

likhna hai.

25. Common mistake 3 — setInterval() ko stop na karna
setInterval(() => {
    console.log("Hello");
}, 1000);

Ye continuously chalta rahega.

Agar limited time ke liye chahiye to clearInterval() use karna hoga.

26. Charon functions ka relation

Ye 4 names yaad rakho:

setTimeout()
clearTimeout()

setInterval()
clearInterval()

Relationship:

setTimeout()
    ↓
ek baar baad me execute
    ↓
clearTimeout()
cancel karta hai


setInterval()
    ↓
baar-baar execute
    ↓
clearInterval()
stop karta hai
27. Syntax summary
setTimeout()
setTimeout(() => {
    // code
}, delay);

Example:

setTimeout(() => {
    console.log("Hello");
}, 2000);
clearTimeout()
let timer = setTimeout(() => {
    console.log("Hello");
}, 2000);

clearTimeout(timer);
setInterval()
setInterval(() => {
    // code
}, interval);

Example:

setInterval(() => {
    console.log("Hello");
}, 2000);
clearInterval()
let timer = setInterval(() => {
    console.log("Hello");
}, 2000);

clearInterval(timer);
28. Ek line me poora concept
setTimeout()   → kuch time BAAD EK BAAR
setInterval()  → har time gap ke BAAD BAAR-BAAR

clearTimeout() → timeout cancel
clearInterval()→ interval stop
        */
    </script>
</body>
