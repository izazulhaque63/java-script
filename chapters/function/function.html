       /* Bilkul. Hum JavaScript Function ko zero/basic level se samjhenge — aise jaise function pehli baar padh rahe ho. Pehle concept samjhenge, phir syntax, parameter, argument, return, function ke types, scope, aur common mistakes. End me practice bhi karenge.

1. Function kya hota hai?

Simple language me:

Function = code ka ek reusable block jo kisi particular kaam ko karta hai.

Maan lo tumhe 10 jagah ye print karna hai:

console.log("Hello");
console.log("Welcome");

Tum baar-baar likh sakte ho:

console.log("Hello");
console.log("Welcome");

console.log("Hello");
console.log("Welcome");

console.log("Hello");
console.log("Welcome");

Lekin ye repetitive hai.

Function bana do:

function greet() {
    console.log("Hello");
    console.log("Welcome");
}

Ab jab kaam karwana ho:

greet();

Output:

Hello
Welcome

Yani ek baar code likho aur jitni baar chaho use karo.

2. Function ki zarurat kyu padti hai?

Functions mainly 4 reasons se use hote hain:

Code repeat hone se bachane ke liye
Code ko organized rakhne ke liye
Ek particular task ko separate rakhne ke liye
Same logic ko different values ke saath use karne ke liye

Example:

function add(a, b) {
    console.log(a + b);
}

add(10, 20);
add(5, 7);
add(100, 200);

Output:

30
12
300

Ek hi function alag-alag numbers ke saath kaam kar raha hai.

3. Function ka basic syntax

Sabse basic function:

function greet() {
    console.log("Hello");
}

Isko parts me samjho:

function greet() {
    console.log("Hello");
}
function

JavaScript ka keyword hai.

Ye JavaScript ko batata hai:

Main function create kar raha hoon.

greet

Function ka naam hai.

greet

Tum naam kuch bhi meaningful rakh sakte ho:

function sayHello() {}
function calculateTotal() {}
function checkAge() {}
function loginUser() {}
()

Parentheses.

greet()

Inke andar hum parameters dete hain.

Abhi empty hain:

()
{ }

Curly braces ke andar function ka actual code hota hai.

{
    console.log("Hello");
}

Is part ko function body kehte hain.

4. Function banana aur function chalana alag cheez hai

Ye bahut important hai.

Agar tum sirf function bana do:

function greet() {
    console.log("Hello");
}

Output kuch nahi aayega.

Kyun?

Kyuki humne function define kiya hai, run nahi kiya.

Function run karne ke liye:

greet();

Complete:

function greet() {
    console.log("Hello");
}

greet();

Output:

Hello

Isko kehte hain:

Function Call / Function Invocation

5. Function ko multiple times call kar sakte hain
function greet() {
    console.log("Hello");
}

greet();
greet();
greet();

Output:

Hello
Hello
Hello

Yahi function ka major benefit hai: reusability.

6. Parameter kya hota hai?

Ab sabse important concept.

Ye function:

function greet() {
    console.log("Hello");
}

Har baar same Hello print karta hai.

Lekin agar hum different person ko greet karna chahein?

Hello Ali
Hello Rahul
Hello Aman

Tab parameter use karenge.

function greet(name) {
    console.log("Hello " + name);
}

Yaha:

name

ek parameter hai.

Function call:

greet("Rahul");

Output:

Hello Rahul
7. Parameter aur Argument me difference

Ye beginners ke liye bahut important interview/exam concept hai.

Dekho:

function greet(name) {
    console.log("Hello " + name);
}

greet("Rahul");

Yaha:

name

= Parameter

Aur:

"Rahul"

= Argument

Simple rule:

Function banate waqt jo variable likhte hain = Parameter
Function call karte waqt jo actual value dete hain = Argument

Example:

function add(a, b) {
    console.log(a + b);
}

add(10, 20);

Parameters:

a
b

Arguments:

10
20
8. Multiple parameters

Ek function me ek se jyada parameters bhi ho sakte hain.

function add(a, b) {
    console.log(a + b);
}

add(5, 10);

Working:

a = 5
b = 10

5 + 10
= 15

Output:

15

Another example:

function introduce(name, age) {
    console.log("My name is " + name);
    console.log("My age is " + age);
}

introduce("Aman", 20);

Output:

My name is Aman
My age is 20
9. Parameters ki position important hoti hai
function introduce(name, age) {
    console.log(name);
    console.log(age);
}

introduce("Rahul", 25);

Yaha:

name = Rahul
age = 25

Lekin:

introduce(25, "Rahul");

To:

name = 25
age = Rahul

JavaScript khud nahi samjhega ki Rahul name hai.

Wo position/order dekhta hai.

10. Parameter na dene par kya hota hai?
function greet(name) {
    console.log(name);
}

greet();

Output:

undefined

Kyun?

Function expect kar raha tha:

name

lekin tumne argument nahi diya.

Isliye:

name = undefined
11. Default Parameter

Is problem ko default parameter se handle kar sakte hain.

function greet(name = "Guest") {
    console.log("Hello " + name);
}

greet();

Output:

Hello Guest

Aur:

greet("Rahul");

Output:

Hello Rahul

Because Rahul diya gaya hai, default "Guest" use nahi hoga.

12. return statement kya hota hai?

Ab function ka sabse important concept.

Ye dekho:

function add(a, b) {
    console.log(a + b);
}

add(10, 20);

Output:

30

Lekin function ne result wapas nahi diya.

Usne sirf console me print kiya.

Agar result ko future me use karna hai:

function add(a, b) {
    return a + b;
}

Function call:

let result = add(10, 20);

console.log(result);

Output:

30
13. console.log() vs return

Bahut important difference.

console.log()

Sirf screen/console par value show karta hai.

function add(a, b) {
    console.log(a + b);
}
return

Value ko function ke bahar bhejta hai.

function add(a, b) {
    return a + b;
}

Then:

let result = add(10, 20);

Ab:

result

ke andar:

30

store ho gaya.

14. return ka real benefit

Example:

function add(a, b) {
    return a + b;
}

let result = add(10, 20);

let finalResult = result * 2;

console.log(finalResult);

Working:

10 + 20 = 30

result = 30

30 × 2 = 60

Output:

60

Agar sirf console.log() use karte, to returned value store nahi hoti.

15. return function ko stop bhi karta hai

Dekho:

function test() {

    console.log("A");

    return;

    console.log("B");
}

Call:

test();

Output:

A

B print nahi hoga.

Kyun?

Kyuki return aate hi function ki execution stop ho jati hai.

16. Return ke baad code execute nahi hota
function add(a, b) {

    return a + b;

    console.log("Hello");
}

console.log("Hello") kabhi execute nahi hoga.

Isko unreachable code kaha ja sakta hai.

17. Agar return na ho to function kya return karta hai?

Interesting point.

function greet() {
    console.log("Hello");
}

let result = greet();

console.log(result);

Output:

Hello
undefined

Kyun?

JavaScript function by default:

undefined

return karta hai jab explicitly return nahi diya ho.

18. Function ke major types

Beginner level par tumhe mainly ye types samajhne hain:

Function Declaration
Function Expression
Anonymous Function
Arrow Function
Callback Function
Immediately Invoked Function Expression — IIFE
Methods

Hum one-by-one karte hain.

19. Function Declaration

Ye sabse normal function hai.

function greet() {
    console.log("Hello");
}

greet();

Isko kehte hain:

Function Declaration

Syntax:

function functionName() {

}

Example:

function add(a, b) {
    return a + b;
}

Beginner ke liye ye sabse pehle use karna best hai.

20. Function Expression

Function ko variable ke andar store kar sakte hain.

let greet = function() {
    console.log("Hello");
};

Call:

greet();

Output:

Hello

Isko kehte hain:

Function Expression

Yaha:

function() {
    console.log("Hello");
}

function hai.

Aur:

let greet

variable me function store hai.

21. Anonymous Function

Anonymous ka meaning:

without name

Example:

function() {
    console.log("Hello");
}

Is function ka koi naam nahi hai.

Normally ise variable me store karte hain:

let greet = function() {
    console.log("Hello");
};

Yaha function ka direct naam nahi hai.

Isliye ye anonymous function hai.

22. Arrow Function

Modern JavaScript me bahut common hai.

Normal function:

function add(a, b) {
    return a + b;
}

Arrow function:

const add = (a, b) => {
    return a + b;
};

Use:

console.log(add(10, 20));

Output:

30

Arrow function me:

=>

bahut important hai.

Isko arrow kehte hain.

23. Arrow function ko aur short kar sakte hain

Ye:

const add = (a, b) => {
    return a + b;
};

short form:

const add = (a, b) => a + b;

Call:

console.log(add(5, 10));

Output:

15

Jab sirf ek expression ho to {} aur return remove kar sakte hain.

JavaScript automatically return karega.

24. Ek parameter ho to parentheses optional hote hain
const square = (num) => {
    return num * num;
};

Isko likh sakte hain:

const square = num => {
    return num * num;
};

Aur short:

const square = num => num * num;

Call:

console.log(square(5));

Output:

25

Beginner ke liye pehle parentheses use karo:

const square = (num) => num * num;

Clear rahega.

25. Callback Function kya hota hai?

Ye thoda advanced hai, but basic idea samjho.

JavaScript me function ko dusre function ke andar argument ki tarah bhej sakte hain.

Example:

function greet() {
    console.log("Hello");
}

function executeFunction(callback) {
    callback();
}

executeFunction(greet);

Output:

Hello

Yaha:

greet

callback function hai.

Simple definition:

Jab ek function ko dusre function ko argument ke form me diya jata hai, use callback function kehte hain.

Ye later bahut use hoga:

setTimeout()

events me:

button.addEventListener()

arrays me:

map()
filter()
forEach()

HTML/JavaScript me bahut common hai.

HTML:

<button onclick="sayHello()">Click Me</button>

JavaScript:

function sayHello() {
    console.log("Hello");
}

User button click karega → function run hoga.

Ye real-world function use hai.

29. Function Scope

Ye important hai.

function test() {

    let name = "Rahul";

    console.log(name);
}

test();

Ye chalega.

Lekin:

function test() {

    let name = "Rahul";
}

console.log(name);

Error:

ReferenceError: name is not defined

Kyun?

name function ke andar create hua hai.

Wo normally function ke bahar available nahi hai.

Isko kehte hain:

Function Scope

Visual:

Outside

function test() {
    ┌─────────────────┐
    │ name = "Rahul"  │
    │                 │
    │ yaha available  │
    └─────────────────┘
}

Outside → name available nahi
30. Function outside variable access kar sakta hai

}

greet();

Rahul

Function generally outer scope ki variable access kar sakta hai.

Function ke andar wala:

Bahar wala:

global/outer variable hai.

33. Discount function
function calculateDiscount(price, discountPercent) {

    let discount = price * discountPercent / 100;

    let finalPrice = price - discount;

    return finalPrice;
}

console.log(calculateDiscount(1000, 20));

Working:

price = 1000
discountPercent = 20

discount =
1000 × 20 / 100
= 200

finalPrice =
1000 - 200
= 800

Output:

800

Wrong expectation:

function greet() {
    console.log("Hello");
}

Output expect kar rahe ho.

But output nahi aayega.

Correct:

function greet() {
    console.log("Hello");
}

greet();
43. Common Beginner Mistake 2 — parentheses bhoolna
function greet() {
    console.log("Hello");
}

greet;

Ye function ko call nahi karega.

Correct:

greet();

Difference:

greet

= function itself/reference

greet()

= function execute karo.

Ye future me bahut important hoga.

44. Common Beginner Mistake 3 — parameter aur argument confuse karna
function add(a, b) {
    return a + b;
}

add(10, 20);

Remember:

a, b
↓
parameters

10, 20
↓
arguments
45. Common Beginner Mistake 4 — return aur console.log() ko same samajhna

Wrong understanding:

function add(a, b) {
    console.log(a + b);
}

let result = add(10, 20);

Ab:

console.log(result);

Output:

30
undefined

Kyun?

Function ne 30 print kiya but return nahi kiya.

Correct:

function add(a, b) {
    return a + b;
}

let result = add(10, 20);

console.log(result);

Output:

30

Wrong:

function test() {

    return 10;

    console.log("Hello");
}

Hello kabhi print nahi hoga.

47. Common Beginner Mistake 6 — function name case-sensitive hai
function greet() {
    console.log("Hello");
}

Greet();

Error.

Because:

greet

and

Greet

different names hain.

JavaScript case-sensitive language hai.

48. Function ka complete flow

Example:

function add(a, b) {

    let sum = a + b;

    return sum;
}

let answer = add(10, 20);

console.log(answer);

Step-by-step:

Step 1
Function create hua

function add(a, b)

Step 2
Function call hua

add(10, 20)

Step 3
Arguments parameters me gaye

a = 10
b = 20

Step 4
Function body execute hui

sum = 10 + 20

sum = 30

Step 5
return sum

return 30

Step 6

answer = 30

Step 7

console.log(answer)

Output = 30

Ye flow tumhe perfectly samajh aa gaya to functions ka base strong ho jayega.

49. Function ka mental model

Function ko ek machine samjho:

       INPUT
         ↓
   ┌───────────┐
   │ FUNCTION  │
   │           │
   │ PROCESS   │
   └───────────┘
         ↓
       OUTPUT

Example:

function square(number) {
    return number * number;
}

Machine:

Input
5
↓
square()
↓
5 × 5
↓
Output
25

Parameters/arguments = Input

Function body = Processing

return = Output

Ye functions ko samajhne ka sabse important model hai.

50. Function ke 4 common combinations
1. No parameter + no return
function greet() {
    console.log("Hello");
}

greet();
2. Parameter + no return
function greet(name) {
    console.log("Hello " + name);
}

greet("Rahul");
3. No parameter + return
function getNumber() {
    return 10;
}

let num = getNumber();
4. Parameter + return
function add(a, b) {
    return a + b;
}

let result = add(10, 20);

Ye last wala real programming me bahut common hai:

Input → Process → Output
