    <script>
        /* do...while Loop

Syntax:

do {
  // code
} while (condition);

Example:

let i = 1;

do {
  console.log(i);
  i++;
} while (i <= 5);

Output:

1
2
3
4
5

Lekin iska important difference hai.

do...while me code kam se kam ek baar zaroor chalega.

Example:

let i = 10;

do {
  console.log(i);
  i++;
} while (i <= 5);

Condition:

10 <= 5

false hai.

Phir bhi output:

10

Kyu?

Kyuki pehle:

do {
}

execute hua.

Uske baad condition check hui.

While vs Do While

while:

while (condition) {
  code;
}

Pehle condition check hoti hai.

do...while:

do {
  code;
} while (condition);

Pehle code chalta hai, phir condition check hoti hai.

Easy rule:

while
Condition → Code

do while
Code → Condition */
    </script>
