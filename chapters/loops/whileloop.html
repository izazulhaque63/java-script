       /* while Loop

Syntax:

while (condition) {
  // code
}

Example:

let i = 1;

while (i <= 5) {
  console.log(i);
  i++;
}

Output:

1
2
3
4
5

Yahan teen cheeze alag jagah hain:

let i = 1;          // initialization

while (i <= 5) {   // condition
  console.log(i);

  i++;              // update
}
for aur while me difference

for me sab ek hi jagah:

for (let i = 1; i <= 5; i++) {
  console.log(i);
}

while me alag:

let i = 1;

while (i <= 5) {
  console.log(i);
  i++;
}

Generally:

for → jab pata ho kitni baar loop chalana hai

while → jab condition ke basis par loop chalana hai

Example:

let password = "";

while (password !== "1234") {
  // password pooch sakte hain
}

Yahan hume nahi pata user kitni attempts lega.

9. Infinite Loop

Bahut important concept.

Agar hum likhen:

let i = 1;

while (i <= 5) {
  console.log(i);
}

Problem kya hai?

Humne:

i++;

nahi likha.

To i hamesha 1 hi rahega.

Condition:

1 <= 5

hamesha true.

To loop kabhi stop nahi hoga.

Ye hai:

Infinite Loop

Correct:

let i = 1;

while (i <= 5) {
  console.log(i);
  i++;
} */
